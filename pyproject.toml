[project]
name = "artalekey"
version = "0.1.2"
description = "A modern hotkey management application"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
dependencies = [
    "PyQt6>=6.6.1",
    "easyocr>=1.7.0",
    "langchain>=0.2.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "openpyxl>=3.1.0",
    "pandas>=1.5.0",
    "pillow>=10.0.0",
    "psutil>=5.9.0",
    "pyinstaller>=6.13.0",
    "pynput>=1.7.6",
    "pyobjc-framework-cocoa>=10.0; sys_platform == 'darwin'",
    "pywin32>=306; sys_platform == 'win32'",
    "python-xlib>=0.33; sys_platform == 'linux'",
    "pyqt6-charts>=6.6.0",
    "pytz>=2023.3",
    "pyyaml>=6.0.0",
    "requests>=2.28.0",
    "shapely>=2.0.0",
    "pyobjc-framework-cocoa>=10.3.2",
    "pyobjc-framework-quartz>=10.3.2",
    "pyobjc-framework-applicationservices>=10.3.2",
    "toml>=0.10.2",
]
requires-python = ">=3.8.1"

[project.optional-dependencies]
build = [
    "setuptools>=69.0.0",
    "wheel>=0.42.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["artalekey"]

[tool.ruff]
line-length = 100 
