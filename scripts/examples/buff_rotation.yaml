name: "Buff Rotation"
description: "Apply buffs every 30 seconds"
version: "1.0"
author: "ArtaleKey"

execution:
  mode: "duration"
  duration: 300  # 5 minutes

window:
  auto_activate: true
  pause_on_focus_loss: true
  target_window: "MapleStory Worlds"

operations:
  # Apply buff 1
  - type: "press"
    key: "f1"
  - type: "delay"
    duration: 500

  # Apply buff 2
  - type: "press"
    key: "f2"
  - type: "delay"
    duration: 500

  # Wait 30 seconds before next buff cycle
  - type: "delay"
    duration: 30000
